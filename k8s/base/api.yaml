apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: localhost:5000/minimal-api:placeholder
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: ASPNETCORE_URLS, value: 'http://+:8080'}
            - {name: BEHAVIOR_REGRESSION, value: 'false'}
            - {name: DOTNET_USE_POLLING_FILE_WATCHER, value: '1'}
            - name: ConnectionStrings__Todos
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: connectionString}}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
