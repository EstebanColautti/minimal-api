apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine3.24
          env:
            - {name: POSTGRES_DB, value: todos}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d todos']}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
